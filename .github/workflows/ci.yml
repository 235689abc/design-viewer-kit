name: validate

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 tools/validate_manifest.py --spec docs/diagrams/flows.json
      - run: python3 tools/gen_diagrams.py --config design-viewer.config.json
      - run: npm run build
